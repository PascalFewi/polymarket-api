<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeltaOdds - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #4a9eff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .login-section {
            max-width: 500px;
            margin: 100px auto;
            background: #151515;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4a9eff;
        }

        button {
            background: linear-gradient(135deg, #4a9eff 0%, #3a7fd5 100%);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 158, 255, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #b0b0b0;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4a4a 0%, #d53a3a 100%);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #4a9eff;
            padding: 8px 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #151515;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #4a9eff;
        }

        .section {
            background: #151515;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            color: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2a2a2a;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }

        tbody td {
            padding: 12px;
            border-bottom: 1px solid #1a1a1a;
        }

        tbody tr:hover {
            background: #1a1a1a;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-free {
            background: rgba(136, 136, 136, 0.2);
            color: #888;
        }

        .badge-professional {
            background: rgba(74, 158, 255, 0.2);
            color: #4a9eff;
        }

        .badge-enterprise {
            background: rgba(138, 43, 226, 0.2);
            color: #a855f7;
        }

        .badge-admin {
            background: rgba(255, 74, 74, 0.2);
            color: #ff4a4a;
        }

        .badge-active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .badge-inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .api-key-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: #0a0a0a;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #2a2a2a;
            display: inline-block;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #151515;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .copy-btn {
            margin-left: 8px;
            padding: 4px 8px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginSection" class="login-section">
        <h1>DeltaOdds Admin</h1>
        <p class="subtitle">Enter your admin API key to continue</p>

        <div id="loginError" class="alert alert-error hidden"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="adminKey">Admin API Key</label>
                <input type="password" id="adminKey" placeholder="admin_xxxxx..." required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Dashboard -->
    <div id="dashboardSection" class="container hidden">
        <div class="dashboard-header">
            <div>
                <h1>DeltaOdds Admin Dashboard</h1>
                <p class="subtitle">Manage API keys and monitor usage</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div id="alertContainer"></div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Keys</div>
                <div class="stat-value" id="statTotalKeys">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Keys</div>
                <div class="stat-value" id="statActiveKeys">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Free Users</div>
                <div class="stat-value" id="statFreeUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pro Users</div>
                <div class="stat-value" id="statProUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Enterprise Users</div>
                <div class="stat-value" id="statEnterpriseUsers">-</div>
            </div>
        </div>

        <!-- API Keys Section -->
        <div class="section">
            <div class="section-header">
                <h2 class="section-title">API Keys</h2>
                <button onclick="showCreateKeyModal()">Create New Key</button>
            </div>

            <div id="keysLoading" class="loading">Loading...</div>
            <div id="keysTable" class="hidden">
                <table>
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>API Key</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Last Used</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="keysTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Key Modal -->
    <div id="createKeyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="section-title">Create New API Key</h2>
                <button class="close-btn" onclick="closeCreateKeyModal()">&times;</button>
            </div>

            <div id="createKeyError" class="alert alert-error hidden"></div>
            <div id="createKeySuccess" class="alert alert-success hidden"></div>

            <form id="createKeyForm">
                <div class="form-group">
                    <label for="userEmail">User Email *</label>
                    <input type="email" id="userEmail" required>
                </div>

                <div class="form-group">
                    <label for="userName">User Name</label>
                    <input type="text" id="userName">
                </div>

                <div class="form-group">
                    <label for="role">Role *</label>
                    <select id="role" required>
                        <option value="free">Free (200 calls/day, 2 weeks lookback)</option>
                        <option value="professional">Professional (10k calls/day, 3 months lookback)</option>
                        <option value="enterprise">Enterprise (unlimited)</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>
                    <textarea id="notes" rows="3" placeholder="Internal notes about this user..."></textarea>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="closeCreateKeyModal()">Cancel</button>
                    <button type="submit">Create API Key</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Key Modal -->
    <div id="editKeyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="section-title">Edit API Key</h2>
                <button class="close-btn" onclick="closeEditKeyModal()">&times;</button>
            </div>

            <div id="editKeyError" class="alert alert-error hidden"></div>
            <div id="editKeySuccess" class="alert alert-success hidden"></div>

            <form id="editKeyForm">
                <input type="hidden" id="editKeyId">

                <div class="form-group">
                    <label for="editUserEmail">User Email</label>
                    <input type="email" id="editUserEmail" required>
                </div>

                <div class="form-group">
                    <label for="editUserName">User Name</label>
                    <input type="text" id="editUserName">
                </div>

                <div class="form-group">
                    <label for="editRole">Role</label>
                    <select id="editRole" required>
                        <option value="free">Free</option>
                        <option value="professional">Professional</option>
                        <option value="enterprise">Enterprise</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editActive">Status</label>
                    <select id="editActive" required>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editNotes">Notes</label>
                    <textarea id="editNotes" rows="3"></textarea>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="closeEditKeyModal()">Cancel</button>
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        let adminKey = null;

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('adminKey').value;

            try {
                const response = await fetch(`${API_BASE}/admin/keys`, {
                    headers: {
                        'X-API-Key': key
                    }
                });

                if (response.ok) {
                    adminKey = key;
                    localStorage.setItem('adminKey', key);
                    showDashboard();
                } else {
                    showLoginError('Invalid admin key');
                }
            } catch (err) {
                showLoginError('Connection error. Is the API server running?');
            }
        });

        // Auto-login if key exists
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('adminKey');
            if (savedKey) {
                document.getElementById('adminKey').value = savedKey;
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        function showLoginError(message) {
            const el = document.getElementById('loginError');
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function logout() {
            adminKey = null;
            localStorage.removeItem('adminKey');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
        }

        async function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            await loadKeys();
        }

        async function loadKeys() {
            try {
                const response = await fetch(`${API_BASE}/admin/keys?limit=1000`, {
                    headers: { 'X-API-Key': adminKey }
                });

                const data = await response.json();

                if (response.ok) {
                    renderKeys(data.data);
                    updateStats(data.data);
                } else {
                    showAlert('error', data.error || 'Failed to load keys');
                }
            } catch (err) {
                showAlert('error', 'Failed to load keys: ' + err.message);
            }
        }

        function renderKeys(keys) {
            document.getElementById('keysLoading').classList.add('hidden');
            document.getElementById('keysTable').classList.remove('hidden');

            const tbody = document.getElementById('keysTableBody');
            tbody.innerHTML = keys.map(key => `
                <tr>
                    <td>
                        <div>${key.user_name || 'N/A'}</div>
                        <div style="font-size: 12px; color: #888;">${key.user_email}</div>
                    </td>
                    <td>
                        <span class="api-key-display">${key.api_key}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${key.api_key}')">Copy</button>
                    </td>
                    <td><span class="badge badge-${key.role}">${key.role}</span></td>
                    <td><span class="badge badge-${key.active ? 'active' : 'inactive'}">${key.active ? 'Active' : 'Inactive'}</span></td>
                    <td>${formatDate(key.created_at)}</td>
                    <td>${key.last_used_at ? formatDate(key.last_used_at) : 'Never'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn btn-secondary" onclick="editKey(${key.id})">Edit</button>
                            <button class="action-btn btn-danger" onclick="deleteKey(${key.id}, '${key.user_email}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(keys) {
            document.getElementById('statTotalKeys').textContent = keys.length;
            document.getElementById('statActiveKeys').textContent = keys.filter(k => k.active).length;
            document.getElementById('statFreeUsers').textContent = keys.filter(k => k.role === 'free').length;
            document.getElementById('statProUsers').textContent = keys.filter(k => k.role === 'professional').length;
            document.getElementById('statEnterpriseUsers').textContent = keys.filter(k => k.role === 'enterprise').length;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showAlert('success', 'API key copied to clipboard');
            });
        }

        function showAlert(type, message) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }

        // Create Key Modal
        function showCreateKeyModal() {
            document.getElementById('createKeyModal').style.display = 'flex';
            document.getElementById('createKeyForm').reset();
            document.getElementById('createKeyError').classList.add('hidden');
            document.getElementById('createKeySuccess').classList.add('hidden');
        }

        function closeCreateKeyModal() {
            document.getElementById('createKeyModal').style.display = 'none';
        }

        document.getElementById('createKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                user_email: document.getElementById('userEmail').value,
                user_name: document.getElementById('userName').value,
                role: document.getElementById('role').value,
                notes: document.getElementById('notes').value,
            };

            try {
                const response = await fetch(`${API_BASE}/admin/keys`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': adminKey
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const successEl = document.getElementById('createKeySuccess');
                    successEl.innerHTML = `
                        <strong>API Key Created Successfully!</strong><br>
                        <span class="api-key-display" style="max-width: 100%">${result.data.api_key}</span>
                        <button class="copy-btn" onclick="copyToClipboard('${result.data.api_key}')">Copy</button>
                    `;
                    successEl.classList.remove('hidden');
                    document.getElementById('createKeyError').classList.add('hidden');

                    setTimeout(() => {
                        closeCreateKeyModal();
                        loadKeys();
                    }, 3000);
                } else {
                    const errorEl = document.getElementById('createKeyError');
                    errorEl.textContent = result.error || 'Failed to create key';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                const errorEl = document.getElementById('createKeyError');
                errorEl.textContent = 'Connection error: ' + err.message;
                errorEl.classList.remove('hidden');
            }
        });

        // Edit Key Modal
        async function editKey(keyId) {
            try {
                const response = await fetch(`${API_BASE}/admin/keys/${keyId}`, {
                    headers: { 'X-API-Key': adminKey }
                });

                const key = await response.json();

                if (response.ok) {
                    document.getElementById('editKeyId').value = key.id;
                    document.getElementById('editUserEmail').value = key.user_email;
                    document.getElementById('editUserName').value = key.user_name || '';
                    document.getElementById('editRole').value = key.role;
                    document.getElementById('editActive').value = key.active.toString();
                    document.getElementById('editNotes').value = key.notes || '';

                    document.getElementById('editKeyModal').style.display = 'flex';
                    document.getElementById('editKeyError').classList.add('hidden');
                    document.getElementById('editKeySuccess').classList.add('hidden');
                } else {
                    showAlert('error', 'Failed to load key details');
                }
            } catch (err) {
                showAlert('error', 'Connection error: ' + err.message);
            }
        }

        function closeEditKeyModal() {
            document.getElementById('editKeyModal').style.display = 'none';
        }

        document.getElementById('editKeyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const keyId = document.getElementById('editKeyId').value;
            const data = {
                user_email: document.getElementById('editUserEmail').value,
                user_name: document.getElementById('editUserName').value,
                role: document.getElementById('editRole').value,
                active: document.getElementById('editActive').value === 'true',
                notes: document.getElementById('editNotes').value,
            };

            try {
                const response = await fetch(`${API_BASE}/admin/keys/${keyId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': adminKey
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    const successEl = document.getElementById('editKeySuccess');
                    successEl.textContent = 'API key updated successfully!';
                    successEl.classList.remove('hidden');
                    document.getElementById('editKeyError').classList.add('hidden');

                    setTimeout(() => {
                        closeEditKeyModal();
                        loadKeys();
                    }, 2000);
                } else {
                    const errorEl = document.getElementById('editKeyError');
                    errorEl.textContent = result.error || 'Failed to update key';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                const errorEl = document.getElementById('editKeyError');
                errorEl.textContent = 'Connection error: ' + err.message;
                errorEl.classList.remove('hidden');
            }
        });

        // Delete Key
        async function deleteKey(keyId, userEmail) {
            if (!confirm(`Are you sure you want to delete the API key for ${userEmail}? This action cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/admin/keys/${keyId}`, {
                    method: 'DELETE',
                    headers: { 'X-API-Key': adminKey }
                });

                const result = await response.json();

                if (response.ok) {
                    showAlert('success', 'API key deleted successfully');
                    loadKeys();
                } else {
                    showAlert('error', result.error || 'Failed to delete key');
                }
            } catch (err) {
                showAlert('error', 'Connection error: ' + err.message);
            }
        }
    </script>
</body>
</html>
